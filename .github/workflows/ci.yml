name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A run that is queued but never picked up gets cancelled by GitHub, which
  # leaves the PR red with nothing to fix — no job produced output, so there is
  # no failure to diagnose. The rerun API answers 403 to the automation token,
  # so without this the only way to ask for another run is to push a commit,
  # and an empty commit is a poor thing to put in a feature branch's history.
  workflow_dispatch:

env:
  # Matches .python-version, the Dockerfile base image, ruff target-version and
  # mypy python_version. Keep the five in step.
  PYTHON_VERSION: "3.12"
  # Must be new enough to read uv.lock revision 3.
  UV_VERSION: "0.8.17"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      # uv fetches the interpreter from a python-build-standalone GitHub
      # release, which answered 503 on the first run of PR #32 and failed the
      # job before a line of this repo was read. Three attempts with a short
      # backoff: a real outage still fails the build, a blip no longer does.
      # The rerun and workflow-dispatch APIs both answer 403 to the automation
      # token, so the alternative to this is a push per transient failure.
      - name: Set up Python
        run: |
          for attempt in 1 2 3; do
            if uv python install "$PYTHON_VERSION"; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      # --frozen fails the build if uv.lock is out of date with pyproject.toml,
      # so a stale lockfile can never reach main again.
      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      # uv fetches the interpreter from a python-build-standalone GitHub
      # release, which answered 503 on the first run of PR #32 and failed the
      # job before a line of this repo was read. Three attempts with a short
      # backoff: a real outage still fails the build, a blip no longer does.
      # The rerun and workflow-dispatch APIs both answer 403 to the automation
      # token, so the alternative to this is a push per transient failure.
      - name: Set up Python
        run: |
          for attempt in 1 2 3; do
            if uv python install "$PYTHON_VERSION"; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      # scripts/ is included because smoke_start.py is a build gate, not a
      # scratch file — a type error there would fail the test job with a
      # traceback that looks like an application bug.
      - name: Run mypy
        run: uv run mypy src/ scripts/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Single-node KRaft broker. Without it the Kafka legs of
      # tests/test_kafka_contract.py and tests/test_kafka_end_to_end.py skip,
      # and a suite that silently skips its integration half is how a backend
      # rots — so this is not optional here, unlike on a developer's machine.
      # It advertises localhost:9092 because the job runs on the host with the
      # port mapped, so the address the client is handed after the metadata
      # fetch has to be the one it dialled.
      kafka:
        image: apache/kafka:3.9.0
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          # Zero rather than the three-second default: every consumer group in
          # the suite is created for one test, so the delay would be three
          # seconds per group with nobody to wait for.
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 20s

    # Throwaway values for ephemeral CI services. Never reuse these anywhere.
    env:
      # Talk to the services declared above and never start a container.
      # `tests/containers.py` would otherwise find them already listening and
      # reuse them anyway, so this is a statement rather than a behaviour
      # change — but it is the statement that keeps this job's three
      # pre-pytest steps honest. `alembic upgrade head`, the import check and
      # `scripts/smoke_start.py` all run outside the pytest process and need a
      # server that outlives it, which a Testcontainers container is not.
      # See docs/integration-testing.md; the `integration` job below is where
      # the container path is measured.
      INTEGRATION_BACKEND: external
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/boilerplate_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      REDIS_URL: redis://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: test-bucket
      # Published in this repository on purpose — the base64 decodes to ASCII
      # saying what it is — and refused by src/encryption/keys.py whenever
      # ENVIRONMENT is "production". The migration step below encrypts with it,
      # so it has to be set before `alembic upgrade head`.
      ENCRYPTION_KEYS: ci:aW5zZWN1cmUtY2kta2V5LW5vdC1mb3ItcmVhbC11c2U=
      ENCRYPTION_ACTIVE_KEY_ID: ci
      # Which Hypothesis profile the property-based tests run under
      # (tests/conftest.py registers them; docs/property-based-testing.md has
      # the reasoning). `ci` is ten times the local example count and no
      # example database — the runner is discarded, so a database here would
      # be written, never read, and would imply a cumulative search that is
      # not happening. Measured cost of the difference: about 20 seconds.
      HYPOTHESIS_PROFILE: ci

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      # uv fetches the interpreter from a python-build-standalone GitHub
      # release, which answered 503 on the first run of PR #32 and failed the
      # job before a line of this repo was read. Three attempts with a short
      # backoff: a real outage still fails the build, a blip no longer does.
      # The rerun and workflow-dispatch APIs both answer 403 to the automation
      # token, so the alternative to this is a push per transient failure.
      - name: Set up Python
        run: |
          for attempt in 1 2 3; do
            if uv python install "$PYTHON_VERSION"; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Verify the app imports against the migrated database
        run: uv run python -c "from src.main import app; print(len(app.routes), 'routes')"

      # Importing the module tree proves nothing about start-up: it never runs the
      # lifespan, opens a connection pool, or binds a socket, so it stays green
      # against a database that does not exist. This boots the real uvicorn
      # process, waits for /health, requires /health/ready to confirm a SELECT 1
      # round-trip to the Postgres service above, and demands a clean SIGTERM exit.
      - name: Verify the app starts and serves from the real Postgres
        run: uv run python scripts/smoke_start.py

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          file: coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration (Testcontainers)
    runs-on: ubuntu-latest
    needs: lint

    # Deliberately no `services:` block, and that absence is the job. The
    # `test` job above declares a Postgres and a Redis, so the fourteen modules
    # that need a real server find one there whether or not
    # `tests/containers.py` works. This job gives them nothing, sets
    # `INTEGRATION_BACKEND=testcontainers`, and so measures the path a
    # developer actually runs on: the suite starting its own servers.
    #
    # It is not redundant with `test`. Before this existed, those 316 tests ran
    # in exactly one environment, and the Phase 0 note in SPEC.md records what
    # that cost — `test_distributed_lock_redis.py` was red locally for weeks
    # while CI was green. This job is the one that would have caught it.
    #
    # `testcontainers` rather than `auto` because `auto` would skip on a runner
    # without a usable Docker daemon, and a job that goes green having run
    # nothing is the failure mode this whole item exists to remove.

    env:
      INTEGRATION_BACKEND: testcontainers
      # No DATABASE_URL and no REDIS_URL, which is the point: the suite
      # publishes both itself after starting the containers. Everything else
      # `src/config.py` validates comes from `tests/conftest.py`'s own
      # `setdefault` block, which is also what the `alembic upgrade head`
      # subprocess inherits — so this job needs no secrets and no database
      # configuration at all. See docs/integration-testing.md.
      ENVIRONMENT: test
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      # Same three-attempt retry as every other job: uv fetches the interpreter
      # from a python-build-standalone GitHub release, which has answered 503.
      - name: Set up Python
        run: |
          for attempt in 1 2 3; do
            if uv python install "$PYTHON_VERSION"; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      # Fail here, with a diagnosable message, rather than inside a pytest
      # collection error if the runner image ever ships without a daemon.
      - name: Confirm a Docker daemon is reachable
        run: docker version

      # The fourteen modules whose subject is the interaction with a real
      # server. Listed rather than globbed: a glob over `*_db.py` and
      # `*redis*.py` would silently stop covering a module renamed outside the
      # pattern, and this list failing to collect is a far better signal than
      # this job quietly shrinking.
      #
      # `--no-cov` because the `test` job owns the coverage gate: a 15-module
      # subset is nowhere near the 80% floor in `[tool.pytest.ini_options]`, so
      # leaving coverage on would fail this job for measuring less than the
      # whole suite.
      #
      # The run is teed and then checked for skips. Under this backend a skip
      # can only mean a server was missing and the suite carried on regardless
      # — which is the precise failure this job exists to refuse, and the one
      # that is invisible in a green summary line. `pytest` has no
      # `--error-on-skip`, and `-rs` makes the reason legible when it fires.
      # `set -o pipefail` because `tee` would otherwise mask a non-zero pytest.
      - name: Run the integration suite against its own containers
        run: |
          set -o pipefail
          uv run pytest --no-cov -rs \
            tests/test_tenancy_db.py \
            tests/test_encryption_db.py \
            tests/test_locking_db.py \
            tests/test_observability_db.py \
            tests/test_optimistic_concurrency_db.py \
            tests/test_outbox_db.py \
            tests/test_streaming_db.py \
            tests/test_idempotency_redis.py \
            tests/test_idempotency_contract.py \
            tests/test_webhook_replay_redis.py \
            tests/test_distributed_lock_redis.py \
            tests/test_distributed_lock_contract.py \
            tests/test_redis_streams_redis.py \
            tests/test_redis_streams_contract.py \
            tests/test_containers.py 2>&1 | tee "$RUNNER_TEMP/integration.log"
          if grep -qE "[0-9]+ skipped" "$RUNNER_TEMP/integration.log"; then
            echo "::error::tests skipped under INTEGRATION_BACKEND=testcontainers, which means a server was unavailable and the suite carried on anyway"
            exit 1
          fi

  mutation:
    name: Mutation score (mutmut)
    runs-on: ubuntu-latest
    needs: lint

    # No service containers, unlike `test`. The eight modules under
    # `only_mutate` are pure decision logic and the seven test files that cover
    # them touch no Postgres, Redis or Kafka — `tests/conftest.py` sets its own
    # environment defaults, so the selection runs against nothing at all. That
    # is also why this job is minutes rather than hours: it is not the suite.

    # And no containers either. `tests/containers.py` already returns early
    # when `mutmut` is in `sys.modules`, which is what makes a local
    # `uv run mutmut run` behave the same way; this states it for the job as
    # well, so the gate does not depend on a Docker daemon it has no use for.
    env:
      INTEGRATION_BACKEND: external

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      # uv fetches the interpreter from a python-build-standalone GitHub
      # release, which answered 503 on the first run of PR #32 and failed the
      # job before a line of this repo was read. Three attempts with a short
      # backoff: a real outage still fails the build, a blip no longer does.
      # The rerun and workflow-dispatch APIs both answer 403 to the automation
      # token, so the alternative to this is a push per transient failure.
      - name: Set up Python
        run: |
          for attempt in 1 2 3; do
            if uv python install "$PYTHON_VERSION"; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/3), retrying"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      # mutmut forks a worker per mutant, so this step is POSIX-only; it is the
      # reason the job is pinned to ubuntu rather than a matrix.
      - name: Run mutmut
        run: uv run mutmut run

      - name: Export the mutation stats
        run: uv run mutmut export-cicd-stats

      # The gate. `mutmut run` above exits 0 whether or not mutants survived —
      # it reports rather than blocks — so this is the step that can fail.
      - name: Check the mutation score against the threshold
        run: uv run python scripts/check_mutation_score.py

      # Uploaded on failure too, and especially then: the stats name the
      # buckets but not the mutants, and `mutants/**/*.meta` is what
      # `mutmut results` and `mutmut show <mutant>` read to say which lines
      # survived. Without it a contributor can only reproduce the run locally.
      - name: Upload the mutation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/**/*.meta
          retention-days: 7

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [typecheck, test, integration, mutation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
